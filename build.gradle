plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'dev.kikugie.stonecutter'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

if (minecraft_version != stonecutter.current.version) {
    throw new GradleException("Minecraft version ${minecraft_version} does not match Stonecutter target ${stonecutter.current.version}")
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        resources.setSrcDirs([rootProject.file('src/gameTest/resources')])
        java.setSrcDirs([rootProject.file('src/gameTest/java')])
    }
}
configurations.gameTestImplementation.extendsFrom configurations.implementation
configurations.gameTestRuntimeOnly.extendsFrom configurations.runtimeOnly

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        integrationGameTest {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('run/client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = layout.projectDirectory.dir('run/server')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.projectDirectory.dir('run/gameTestServer')
        }
        data {
            data()
            gameDirectory = layout.projectDirectory.dir('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                layout.projectDirectory.dir('src/generated/resources').asFile.absolutePath, '--existing',
                rootProject.file('src/main/resources').absolutePath
        }
        configureEach {
            loadedMods = [neoForge.mods.getByName(project.mod_id)]
            if (name == 'gameTestServer') {
                loadedMods = [neoForge.mods.getByName('integrationGameTest')]
                sourceSet = sourceSets.gameTest
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

neoForge.addModdingDependenciesTo(sourceSets.gameTest)
tasks.named('check') { dependsOn tasks.named('gameTestClasses') }

sourceSets.main.resources.srcDirs rootProject.file('src/generated/resources'), layout.projectDirectory.dir('src/generated/resources')

dependencies {
    implementation "maven.modrinth:toms-storage:${toms_storage_version}"
    implementation "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    implementation "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:rei:${rei_version}"

    def viewer = providers.gradleProperty('recipeViewer').orElse('jei').get()
    switch (viewer) {
        case 'jei':
            runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
            break
        case 'emi':
            runtimeOnly "maven.modrinth:emi:${emi_version}"
            break
        case 'rei':
            runtimeOnly "maven.modrinth:rei:${rei_version}"
            runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
            runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"
            break
        case 'none':
            break
        default:
            throw new GradleException("Unknown recipeViewer '${viewer}'; use jei, emi, rei, or none")
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/templates')
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_id}-${minecraft_version}-neoforge"
            from components.java
        }
    }
    repositories {
        maven {
            url = rootProject.layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
