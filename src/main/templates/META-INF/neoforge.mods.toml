modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "toms_storage"
type = "required"
versionRange = "[2.4.2,2.5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sophisticatedbackpacks"
type = "required"
versionRange = "[3.26.9,3.27)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sophisticatedcore"
type = "required"
versionRange = "[1.5.7,1.6)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "sophisticatedintegrations.mixins.json"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
